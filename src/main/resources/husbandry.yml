max-animals: 15
care-max: 200

min-loaded: 60s
decay-grace: 24h
offline-care: 8h
long-unload-force: 8h
milk-cooldown: 20m
wool-timer: 20m
shed-timer: 8h
shed-chance: 0.15
egg-timer: 10m

affliction:
  mean: 6h
  min: 4h
  max: 8h

care:
  up:
    interval: 1h
    amount: 1
  down:
    interval: 1h
    amount: 1

grow-up: 1h

initial-genetic-max: 20
max-genetics: 1000
min-roast-cuts: 1

breeding:
  genetic-variance-multiplier: 1.0
  genetic-slowdown-divisor: 1.0

amount-from-genetics:
  - min: 0
    roast-cuts: 1
    wool: 1
    secondary-extra: 0
  - min: 125
    roast-cuts: 2
    wool: 1
    secondary-extra: 0
  - min: 250
    roast-cuts: 3
    wool: 1
    secondary-extra: 0
  - min: 375
    roast-cuts: 4
    wool: 2
    secondary-extra: 0
  - min: 500
    roast-cuts: 5
    wool: 2
    secondary-extra: 1
  - min: 625
    roast-cuts: 6
    wool: 3
    secondary-extra: 1
  - min: 750
    roast-cuts: 7
    wool: 3
    secondary-extra: 2
  - min: 875
    roast-cuts: 8
    wool: 4
    secondary-extra: 2

items:
